<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A" />
      <stop offset="50%" stop-color="#121A2C" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF" />
      <stop offset="50%" stop-color="#8A5CFF" />
      <stop offset="100%" stop-color="#38E1FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8A5CFF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for iOS/PWA -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1F2B47" stroke-width="3" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2C3C61" stroke-width="1.5" />

  <!-- Outer Shield Glow -->
  <path d="M 256 95 L 375 145 C 375 270 256 385 256 385 C 256 385 137 270 137 145 Z" fill="url(#shieldGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Shield Base Outline -->
  <path d="M 256 95 L 375 145 C 375 270 256 385 256 385 C 256 385 137 270 137 145 Z" fill="#121A2C" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Biometric Fingerprint / Face ID Ring Accents -->
  <g fill="none" stroke="url(#shieldGrad)" stroke-linecap="round">
    <!-- Fingerprint / Biometric concentric curves -->
    <path d="M 256 160 C 295 160 320 185 320 220 C 320 270 285 305 256 330 C 227 305 192 270 192 220 C 192 185 217 160 256 160 Z" stroke-width="4" opacity="0.4" />
    
    <!-- Lock body & shackle -->
    <!-- Shackle -->
    <path d="M 220 220 V 195 C 220 175 236 158 256 158 C 276 158 292 175 292 195 V 220" stroke-width="7" stroke="#38E1FF" />
  </g>

  <!-- Lock Body -->
  <rect x="206" y="215" width="100" height="85" rx="18" fill="url(#shieldGrad)" filter="url(#glow)" />
  
  <!-- Keyhole & Biometric Scan Target -->
  <circle cx="256" cy="248" r="10" fill="#0B0F1A" />
  <polygon points="252,248 260,248 262,272 250,272" fill="#0B0F1A" />
  
  <!-- Modern Corner Accent Markers (Face ID brackets) -->
  <path d="M 175 165 H 155 V 185" fill="none" stroke="#38E1FF" stroke-width="5" stroke-linecap="round" />
  <path d="M 337 165 H 357 V 185" fill="none" stroke="#38E1FF" stroke-width="5" stroke-linecap="round" />
  <path d="M 175 305 H 155 V 285" fill="none" stroke="#8A5CFF" stroke-width="5" stroke-linecap="round" />
  <path d="M 337 305 H 357 V 285" fill="none" stroke="#8A5CFF" stroke-width="5" stroke-linecap="round" />

  <!-- Security Pulse Dot -->
  <circle cx="256" cy="125" r="5" fill="#38E1FF" filter="url(#glow)" />
</svg>
