<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        class FakeHmrSocket extends EventTarget {
          static CONNECTING = 0;
          static OPEN = 1;
          static CLOSING = 2;
          static CLOSED = 3;
          CONNECTING = 0;
          OPEN = 1;
          CLOSING = 2;
          CLOSED = 3;
          readyState = 1;
          url = '';
          protocol = 'vite-hmr';
          extensions = '';
          binaryType = 'blob';
          bufferedAmount = 0;
          constructor(url) {
            super();
            this.url = String(url);
            setTimeout(() => {
              this.dispatchEvent(new Event('open'));
            }, 0);
          }
          send() {}
          close() {
            this.readyState = 3;
            this.dispatchEvent(new Event('close'));
          }
        }

        window.WebSocket = function(url, protocols) {
          if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr')) || (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')))) {
            return new FakeHmrSocket(url);
          }
          return new NativeWebSocket(url, protocols);
        };
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
        window.WebSocket.prototype = NativeWebSocket.prototype;

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e.reason && (e.reason.message || e.reason.stack || '')) || '';
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
            e.preventDefault();
          }
        });
        window.addEventListener('error', function(e) {
          var msg = (e.message || '') + ' ' + (e.filename || '');
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
            e.preventDefault();
          }
        });
      })();
    </script>
