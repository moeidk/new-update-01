name: Build & Deploy (Cloudflare Workers)

# Fully automatic:
#   git push to main          → tests → build → deploy to PRODUCTION
#   git push to any branch    → tests → build → deploy to STAGING (preview)
#   pull request              → tests + build only
# Open apps notice the new version within ~1 minute and show the "new version" banner.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'محیط استقرار (staging یا production)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  build:
    name: تست و بیلد
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.target.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20 # recent commit messages become the in-app changelog

      - name: تعیین محیط استقرار
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.target_environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci --legacy-peer-deps

      - name: بررسی تایپ‌اسکریپت (فرانت‌اند + Worker)
        run: npm run lint

      - name: بیلد و تولید version.json
        run: npm run build
        env:
          NODE_ENV: production
          DEPLOY_ENV: ${{ steps.target.outputs.env }}

      - name: آزمایش بسته‌بندی Worker (بدون انتشار)
        run: npx wrangler deploy --env="" --dry-run --outdir .wrangler-dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: استقرار روی Cloudflare (${{ needs.build.outputs.deploy_env }})
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.deploy_env }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ needs.build.outputs.deploy_env }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: بررسی وجود توکن Cloudflare
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ سکرت CLOUDFLARE_API_TOKEN تنظیم نشده است"
              echo "بیلد و تست‌ها موفق بودند ✅ ولی استقرار انجام نشد."
              echo ""
              echo "مسیر: **Settings › Secrets and variables › Actions › New repository secret**"
              echo "- نام: \`CLOUDFLARE_API_TOKEN\` (قالب «Edit Cloudflare Workers» در داشبورد Cloudflare)"
              echo "- اختیاری: \`CLOUDFLARE_ACCOUNT_ID\`"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$DEPLOY_ENV" = "production" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN is missing — production was NOT deployed."
              exit 1
            fi
            echo "::warning::CLOUDFLARE_API_TOKEN is missing — staging deploy skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: نصب wrangler
        if: steps.token.outputs.present == 'true'
        run: npm ci --legacy-peer-deps

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: dist
          path: dist

      - name: آماده‌سازی فضای ذخیره ابری (KV)
        if: steps.token.outputs.present == 'true'
        run: node scripts/ensure-kv.mjs "$DEPLOY_ENV"

      - name: استقرار (Zero Downtime)
        id: deploy
        if: steps.token.outputs.present == 'true'
        shell: bash # -eo pipefail: a failed deploy fails the job
        run: |
          npx wrangler deploy --env "$DEPLOY_ENV" 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### ✅ نسخه جدید روی ${DEPLOY_ENV} منتشر شد"
            echo "- آدرس: ${URL:-'(دامنه سفارشی)'}"
            echo "- کامیت: \`${GITHUB_SHA::7}\` روی برنچ \`${GITHUB_REF_NAME}\`"
            echo "- کاربرانی که برنامه باز است ظرف حدود یک دقیقه پیام «نسخه جدید» را می‌بینند."
          } >> "$GITHUB_STEP_SUMMARY"
